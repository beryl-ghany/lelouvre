<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Corp — Software Engineering Intern</title>
</head>
<body>
  <h1>Apply — Software Engineering Intern (Summer 2027)</h1>
  <form id="application_form" action="/submit" method="post">
    <label>First name <input name="first_name" required></label>
    <label>Last name <input name="last_name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>School <input name="school" required></label>
    <label>GPA <input name="gpa" required></label>
    <label>
      Will you now or in the future require visa sponsorship to work in the United States?
      <select name="sponsorship" required>
        <option value="">Select…</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </label>
    <label>
      Why do you want to work at Demo Corp?
      <textarea name="why_demo" rows="4" required></textarea>
    </label>
    <button type="submit">Submit application</button>
  </form>
</body>
</html>
